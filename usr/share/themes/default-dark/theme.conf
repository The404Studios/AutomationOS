# AutomationOS Default Dark Theme
# Version 1.0

[metadata]
name = "Default Dark"
author = "AutomationOS Team"
description = "Beautiful dark theme optimized for low-light environments"
version = "1.0"
mode = dark

# ============================================================================
# COLOR PALETTE
# ============================================================================

[colors]
# Accent colors (brighter for dark backgrounds)
primary = #0A84FF
primary_hover = #409CFF
primary_light = #1C3A52
primary_dark = #0055BB

secondary = #5E5CE6
success = #32D74B
warning = #FF9F0A
error = #FF453A

# Background layers
bg_primary = #1C1C1E
bg_secondary = #2C2C2E
bg_tertiary = #3A3A3C
bg_quaternary = #48484A

# Text colors
text_primary = #FFFFFF
text_secondary = #AEAEB2
text_tertiary = #8E8E93
text_placeholder = rgba(142, 142, 147, 128)

# UI element colors
panel_bg = rgba(45, 45, 45, 230)
dock_bg = rgba(30, 30, 30, 200)
window_bg = #2C2C2E
menu_bg = rgba(45, 45, 45, 245)

# Borders and dividers
border = #38383A
border_light = #2C2C2E
separator = #48484A

# Overlays
overlay_light = rgba(255, 255, 255, 13)
overlay = rgba(0, 0, 0, 128)
overlay_heavy = rgba(0, 0, 0, 204)

# Focus and selection
focus_ring = #0A84FF
selection_bg = #1C3A52
selection_text = #0A84FF

# ============================================================================
# WINDOW DECORATIONS
# ============================================================================

[window]
titlebar_height = 32
border_width = 1
corner_radius = 8
show_traffic_lights = true
show_title_text = true

# Window shadow: offset_x offset_y blur spread opacity
shadow = 0 8 24 0 102

# ============================================================================
# PANEL (TOP BAR)
# ============================================================================

[panel]
height = 32
padding = 8
icon_size = 16

# Panel shadow
shadow = 0 2 4 0 26

# ============================================================================
# DOCK (APP LAUNCHER)
# ============================================================================

[dock]
icon_size = 64
padding = 8
margin = 16
magnification_enabled = true

# Dock shadow
shadow = 0 12 32 0 77

# ============================================================================
# MENUS & CONTEXT MENUS
# ============================================================================

[menu]
corner_radius = 8
shadow = 0 6 16 0 51

# ============================================================================
# NOTIFICATIONS
# ============================================================================

[notification]
corner_radius = 12
width = 360
shadow = 0 12 24 0 64

# ============================================================================
# TYPOGRAPHY
# ============================================================================

[typography]
family = "Inter"
base_size = 13
scale_factor = 1.0

# ============================================================================
# ANIMATIONS
# ============================================================================

[animations]
enabled = true
speed_multiplier = 1.0

# ============================================================================
# ACCESSIBILITY
# ============================================================================

[accessibility]
high_contrast = false
reduce_transparency = false
reduce_motion = false
text_scale = 1.0
