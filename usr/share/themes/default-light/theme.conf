# AutomationOS Default Light Theme
# Version 1.0

[metadata]
name = "Default Light"
author = "AutomationOS Team"
description = "Clean, accessible light theme with vibrant colors"
version = "1.0"
mode = light

# ============================================================================
# COLOR PALETTE
# ============================================================================

[colors]
# Accent colors
primary = #007AFF
primary_hover = #0066DD
primary_light = #E6F2FF
primary_dark = #0055BB

secondary = #5856D6
success = #34C759
warning = #FF9500
error = #FF3B30

# Background layers
bg_primary = #FFFFFF
bg_secondary = #F8F8F8
bg_tertiary = #F0F0F0
bg_quaternary = #E8E8E8

# Text colors
text_primary = #1C1C1E
text_secondary = #636366
text_tertiary = #8E8E93
text_placeholder = rgba(142, 142, 147, 128)

# UI element colors
panel_bg = rgba(240, 240, 240, 230)
dock_bg = rgba(255, 255, 255, 200)
window_bg = #FFFFFF
menu_bg = rgba(255, 255, 255, 245)

# Borders and dividers
border = #D1D1D6
border_light = #E5E5EA
separator = #C6C6C8

# Overlays
overlay_light = rgba(0, 0, 0, 13)
overlay = rgba(0, 0, 0, 77)
overlay_heavy = rgba(0, 0, 0, 153)

# Focus and selection
focus_ring = #007AFF
selection_bg = #E6F2FF
selection_text = #0055BB

# ============================================================================
# WINDOW DECORATIONS
# ============================================================================

[window]
titlebar_height = 32
border_width = 1
corner_radius = 8
show_traffic_lights = true
show_title_text = true

# Window shadow: offset_x offset_y blur spread opacity
shadow = 0 4 16 0 51

# ============================================================================
# PANEL (TOP BAR)
# ============================================================================

[panel]
height = 32
padding = 8
icon_size = 16

# Panel shadow
shadow = 0 1 2 0 13

# ============================================================================
# DOCK (APP LAUNCHER)
# ============================================================================

[dock]
icon_size = 64
padding = 8
margin = 16
magnification_enabled = true

# Dock shadow
shadow = 0 8 24 0 41

# ============================================================================
# MENUS & CONTEXT MENUS
# ============================================================================

[menu]
corner_radius = 8
shadow = 0 4 12 0 31

# ============================================================================
# NOTIFICATIONS
# ============================================================================

[notification]
corner_radius = 12
width = 360
shadow = 0 8 16 0 41

# ============================================================================
# TYPOGRAPHY
# ============================================================================

[typography]
family = "Inter"
base_size = 13
scale_factor = 1.0

# ============================================================================
# ANIMATIONS
# ============================================================================

[animations]
enabled = true
speed_multiplier = 1.0

# ============================================================================
# ACCESSIBILITY
# ============================================================================

[accessibility]
high_contrast = false
reduce_transparency = false
reduce_motion = false
text_scale = 1.0
